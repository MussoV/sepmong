# Copia de referencia de /mosquitto/config/mosquitto.conf en el servidor del semillero.
# Mosquitto 2.x (contenedor "mosquitto", stack existente del servidor).
# La configuración real vive en el servidor; si se cambia allá, actualizar esta copia.

listener 1883
listener 9001
protocol websockets

allow_anonymous false
persistence true
persistence_location /mosquitto/data/

# Log a stdout: se consulta con `docker logs mosquitto`
# (el log en archivo nunca funcionó: la carpeta /mosquitto/log no era escribible)
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S

password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
