# /etc/systemd/system/docker.service.d/despues-de-wireguard.conf
# (solo en el SERVIDOR DE LA AGENCIA)
#
# Mongo publica su puerto en 10.8.0.1, una IP que solo existe cuando wg0 está arriba.
# Si Docker arrancara antes que WireGuard tras un reinicio, el contenedor fallaría.
# "Wants" y no "Requires": si WireGuard falla, el resto de contenedores
# (Influx, Node-RED, cámaras) igual arrancan.
[Unit]
After=wg-quick@wg0.service
Wants=wg-quick@wg0.service
